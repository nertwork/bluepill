<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: "BluePill Documentation" }}</title>
    <meta name="description" content="{{ page.description | default: "Native Linux/Wayland iMessage Client & Zero-Electron macOS Relay" }}">
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/logo.png">

    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121927;
            --bg-card: #182235;
            --accent-cyan: #00e5ff;
            --accent-blue: #3b82f6;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #23324d;
            --code-bg: #0d131f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.65;
            padding-bottom: 80px;
        }
        .top-nav {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(10, 14, 23, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; font-weight: 700; }
        .nav-brand img { width: 32px; height: 32px; border-radius: 8px; }
        .nav-links { display: flex; align-items: center; gap: 20px; list-style: none; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.92rem; font-weight: 500; }
        .nav-links a:hover { color: var(--accent-cyan); }
        .doc-wrapper { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
        .doc-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 40px 48px; }
        .doc-content h1 { font-size: 2.2rem; margin-bottom: 20px; color: #fff; }
        .doc-content h2 { font-size: 1.6rem; margin: 30px 0 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .doc-content p { margin-bottom: 16px; color: #cbd5e1; }
        .doc-content code { background: #080d17; color: var(--accent-cyan); padding: 2px 6px; border-radius: 4px; }
        .doc-content pre { background: var(--code-bg); border: 1px solid var(--border); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 20px 0; }
        .doc-content pre code { background: transparent; padding: 0; }
        .doc-content table { width: 100%; border-collapse: collapse; margin: 24px 0; }
        .doc-content th, .doc-content td { padding: 10px 14px; border: 1px solid var(--border); }
        .doc-content th { background: var(--bg-card); color: var(--accent-cyan); }
        .doc-content a { color: var(--accent-cyan); }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="index.html" class="nav-brand">
            <img src="logo.png" alt="BluePill Logo">
            <span>BluePill 💊</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Overview</a></li>
            <li><a href="INSTALLATION_AND_OPERATIONS_GUIDE.html">Install Guide</a></li>
            <li><a href="AGENT_INSTALL_PLAYBOOK.html">AI Playbook</a></li>
            <li><a href="AGENTS.html">Directives</a></li>
            <li><a href="https://github.com/nertwork/bluepill" target="_blank">GitHub</a></li>
        </ul>
    </nav>
    <div class="doc-wrapper">
        <main class="doc-content">
            {{ content }}
        </main>
    </div>
</body>
</html>
