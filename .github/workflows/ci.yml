name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  lint-and-validate:
    name: Lint, Syntax & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Linked GitHub Issue on Pull Requests
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PY'
          import json, os, re, sys, urllib.request, urllib.error

          body = os.environ.get("PR_BODY") or ""
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          kw = r"(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|ref(?:s|erences?)?)"
          ref_rx = re.compile(
              rf"(?:https://github\.com/{re.escape(repo)}/issues/|#)(\d+)",
              re.IGNORECASE,
          )
          kw_prefix_rx = re.compile(
              rf"\b{kw}(?:[ \t]*/[ \t]*{kw}){{0,4}}(?:[ \t]*\([^()\r\n]*\)){{0,2}}[ \t*:]*(?:\r?\n[ \t*]*)?\Z",
              re.IGNORECASE,
          )
          nums = sorted({
              m.group(1)
              for m in ref_rx.finditer(body)
              if kw_prefix_rx.search(body[max(0, m.start() - 256):m.start()])
          })
          if not nums:
              print("ERROR: Pull Request must reference a GitHub issue (e.g., 'Closes #123' or 'Fixes #123').")
              sys.exit(1)

          valid = []
          for num in nums:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{num}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "bluepill-ci-issue-gate",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode())
                      if "pull_request" not in data:
                          valid.append(f"#{num}")
              except urllib.error.URLError as exc:
                  print(f"Warning: could not verify #{num}: {exc}")

          if not valid:
              print(f"ERROR: Referenced IDs ({', '.join('#' + n for n in nums)}) did not resolve to an open/existing issue in {repo}.")
              sys.exit(1)

          print("Verified linked issue(s):", ", ".join(valid))
          PY

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Security & Configuration Hygiene
        run: |
          python3 -c '
          import os, re, sys
          forbidden = [
              r"bluebubbles\.ilb", r"bluebubbles\.home", r"home\.nertwork",
              r"172\.28\.", r"jfarr", r"Sponsee", r"Amberwood"
          ]
          rx = re.compile("|".join(forbidden), re.IGNORECASE)
          hits = []
          for dp, dn, fn in os.walk("."):
              for skip in [".git", "build", "obj", "moc", "rcc"]:
                  if skip in dn: dn.remove(skip)
              for f in fn:
                  if f.endswith((".png", ".wav", ".svg", ".ico")): continue
                  p = os.path.join(dp, f)
                  if "workflows/" in p: continue
                  with open(p, errors="ignore") as fh:
                      for i, line in enumerate(fh, 1):
                          if rx.search(line):
                              hits.append(f"{p}:{i}: {line.strip()}")
          if hits:
              print("Hardcoded credentials or non-example configuration strings found:\n" + "\n".join(hits))
              sys.exit(1)
          print("Security & configuration hygiene scan passed across all repository files.")
          '

      - name: Python Relay Server Compilation & Self-Test
        run: |
          python3 -m py_compile server/bluepill_server.py
          python3 server/bluepill_server.py --selftest

      - name: Shell Scripts & Homebrew Formula Syntax Verification
        run: |
          bash -n bin/build bin/test packaging/build-deb.sh packaging/build-rpm.sh
          ruby -c Formula/bluepill.rb

  build-and-test:
    name: Arch Linux Build, Unit Tests & Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch Linux Dependencies
        run: |
          pacman -Syu --noconfirm base-devel git qt6-base qt6-declarative qt6-svg qt6-multimedia qt6-multimedia-ffmpeg qt6-wayland libnotify libheif imagemagick ttf-dejavu python

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Security & Configuration Hygiene
        run: |
          python3 -c '
          import os, re, sys
          forbidden = [
              r"bluebubbles\.ilb", r"bluebubbles\.home", r"home\.nertwork",
              r"172\.28\.", r"jfarr", r"Sponsee", r"Amberwood"
          ]
          rx = re.compile("|".join(forbidden), re.IGNORECASE)
          hits = []
          for dp, dn, fn in os.walk("."):
              for skip in [".git", "build", "obj", "moc", "rcc"]:
                  if skip in dn: dn.remove(skip)
              for f in fn:
                  if f.endswith((".png", ".wav", ".svg", ".ico")): continue
                  p = os.path.join(dp, f)
                  if "workflows/" in p: continue
                  with open(p, errors="ignore") as fh:
                      for i, line in enumerate(fh, 1):
                          if rx.search(line):
                              hits.append(f"{p}:{i}: {line.strip()}")
          if hits:
              print("Hardcoded credentials or non-example configuration strings found:\n" + "\n".join(hits))
              sys.exit(1)
          print("Security & configuration hygiene scan passed across all repository files.")
          '

      - name: Compile imsg (C++20 / Qt6)
        run: ./bin/build

      - name: Run Full Test Suite (Offscreen QPA)
        run: |
          QT_QPA_PLATFORM=offscreen ./bin/test
          BLUEBUBBLES_URL=http://127.0.0.1:9 BLUEBUBBLES_PASSWORD=dummy QT_QPA_PLATFORM=offscreen ./tests/imsg_tests testIcloudCalendarEventsLifecycle
          python3 server/bluepill_server.py --selftest

      - name: Verify Demo Mode Offscreen Screenshot Rendering
        run: |
          QT_QPA_PLATFORM=offscreen ./build/imsg --demo-screenshot /tmp/ci-demo.png
          test -s /tmp/ci-demo.png

      - name: Build Arch Linux Package (makepkg)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd pkgbuild && makepkg -fs --noconfirm"
          ls -lh pkgbuild/*.pkg.tar*

  build-deb:
    name: Debian/Ubuntu (.deb) Build, Tests & Package
    runs-on: ubuntu-24.04
    steps:
      - name: Install Ubuntu 24.04 Build & Qt6 Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build dpkg-dev qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-multimedia-dev qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qtquick-templates qml6-module-qtquick-window qt6-image-formats-plugins libqt6svg6 libnotify-bin imagemagick libheif-examples libheif-plugin-libde265 libheif-plugin-x265

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build, Test & Package (.deb)
        run: ./packaging/build-deb.sh dist

      - name: Verify Clean .deb Install
        run: |
          sudo apt-get install -y ./dist/bluepill_*.deb
          bluepill --version
          bluepill --help
          imsg --version
          QT_QPA_PLATFORM=offscreen bluepill --demo --test-startup

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bluepill-deb
          path: dist/bluepill_*.deb

  build-rpm:
    name: Fedora (.rpm) Build, Tests & Package
    runs-on: ubuntu-latest
    container:
      image: fedora:41
    steps:
      - name: Install Fedora 41 Build & Qt6 Dependencies
        run: |
          dnf install -y -q rpm-build cmake gcc-c++ ninja-build qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg-devel qt6-qtmultimedia-devel libnotify ImageMagick ImageMagick-heic libheif-tools

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build, Test & Package (.rpm)
        run: ./packaging/build-rpm.sh dist

      - name: Verify Clean .rpm Install
        run: |
          dnf install -y -q ./dist/bluepill-*.rpm
          bluepill --version
          bluepill --help
          imsg --version
          QT_QPA_PLATFORM=offscreen bluepill --demo --test-startup

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bluepill-rpm
          path: dist/bluepill-*.rpm

  build-windows:
    name: Windows Build, Unit Tests & Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtimageformats qtmultimedia'

      - name: Configure & Build (CMake + MSVC + Ninja)
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              $vsNinja = Join-Path $env:DevEnvDir "CommonExtensions\Microsoft\CMake\Ninja\ninja.exe"
              if (Test-Path $vsNinja) {
                  $env:Path = (Split-Path $vsNinja) + ";" + $env:Path
              } else {
                  choco install ninja -y --no-progress
                  $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
              }
          }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Unit Tests (Offscreen QPA)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
              choco install ffmpeg -y --no-progress
          }
          .\build\imsg_tests.exe -o build\imsg_tests.log,txt
          $rc = $LASTEXITCODE
          if (Test-Path build\imsg_tests.log) { Get-Content build\imsg_tests.log }
          if ($rc -ne 0) { exit $rc }

      - name: Deploy Qt6 Runtime & Build Inno Setup Installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(bluepill VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force -Path build-win-dist | Out-Null
          Copy-Item build\bluepill.exe build-win-dist\bluepill.exe
          $windeploy = Join-Path $env:QT_ROOT_DIR "bin\windeployqt6.exe"
          if (-not (Test-Path $windeploy)) {
              $windeploy = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"
          }
          & $windeploy --release --qmldir src --no-translations build-win-dist\bluepill.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qtMmPlugins = Join-Path $env:QT_ROOT_DIR "plugins\multimedia"
          if (Test-Path $qtMmPlugins) {
              New-Item -ItemType Directory -Force -Path build-win-dist\multimedia | Out-Null
              Copy-Item (Join-Path $qtMmPlugins "*.dll") build-win-dist\multimedia\ -Force
          }
          if (-not (Test-Path build-win-dist\Qt6Multimedia.dll)) {
              Write-Error "Qt6Multimedia.dll missing from build-win-dist (BLUEPILL_HAS_MULTIMEDIA=1 requires Qt6::Multimedia)"
              exit 1
          }
          if (-not (Get-ChildItem -Path build-win-dist\multimedia -Filter "*.dll" -ErrorAction SilentlyContinue)) {
              Write-Error "Qt6 Multimedia plugins missing from build-win-dist\multimedia"
              exit 1
          }
          if ($env:VCToolsRedistDir -and (Test-Path $env:VCToolsRedistDir)) {
              Get-ChildItem -Path $env:VCToolsRedistDir -Filter "*.dll" -Recurse | Where-Object { $_.DirectoryName -match "\\x64\\Microsoft\.VC.*CRT$" } | ForEach-Object {
                  Copy-Item $_.FullName build-win-dist\ -Force
              }
          }

          $env:QT_QPA_PLATFORM = "offscreen"
          & build-win-dist\bluepill.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build-win-dist\bluepill.exe --demo --test-startup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
              $defaultIscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
              if (Test-Path $defaultIscc) {
                  $iscc = $defaultIscc
              } else {
                  choco install innosetup -y --no-progress
                  $iscc = $defaultIscc
              }
          }
          & $iscc "/DAppVersion=$ver" "/DDistDir=..\build-win-dist" installer\bluepill.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\BluePill-Setup-*.exe

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v7
        with:
          name: bluepill-windows-installer
          path: dist/BluePill-Setup-*.exe
