name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  lint-and-validate:
    name: Lint, Syntax & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Linked GitHub Issue on Pull Requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'PY'
          import json, os, re, sys, urllib.request, urllib.error

          body = os.environ.get("PR_BODY") or ""
          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          kw = r"(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|ref(?:s|erences?)?)"
          ref_rx = re.compile(
              rf"(?:https://github\.com/{re.escape(repo)}/issues/|#)(\d+)",
              re.IGNORECASE,
          )
          kw_prefix_rx = re.compile(
              rf"\b{kw}(?:[ \t]*/[ \t]*{kw}){{0,4}}(?:[ \t]*\([^()\r\n]*\)){{0,2}}[ \t*:]*(?:\r?\n[ \t*]*)?\Z",
              re.IGNORECASE,
          )
          nums = sorted({
              m.group(1)
              for m in ref_rx.finditer(body)
              if kw_prefix_rx.search(body[max(0, m.start() - 256):m.start()])
          })
          if not nums:
              print("ERROR: Pull Request must reference a GitHub issue (e.g., 'Closes #123' or 'Fixes #123').")
              sys.exit(1)

          valid = []
          for num in nums:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{num}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "bluepill-ci-issue-gate",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      data = json.loads(resp.read().decode())
                      if "pull_request" not in data:
                          valid.append(f"#{num}")
              except urllib.error.URLError as exc:
                  print(f"Warning: could not verify #{num}: {exc}")

          if not valid:
              print(f"ERROR: Referenced IDs ({', '.join('#' + n for n in nums)}) did not resolve to an open/existing issue in {repo}.")
              sys.exit(1)

          print("Verified linked issue(s):", ", ".join(valid))
          PY

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Zero-PII & Secret Sanitization Audit
        run: |
          python3 -c '
          import os, re, sys
          forbidden = [
              r"bluebubbles\.ilb", r"bluebubbles\.home", r"home\.nertwork",
              r"172\.28\.", r"jfarr", r"Sponsee", r"Amberwood"
          ]
          rx = re.compile("|".join(forbidden), re.IGNORECASE)
          hits = []
          for dp, dn, fn in os.walk("."):
              for skip in [".git", "build", "obj", "moc", "rcc"]:
                  if skip in dn: dn.remove(skip)
              for f in fn:
                  if f.endswith((".png", ".wav", ".svg")): continue
                  p = os.path.join(dp, f)
                  if "workflows/" in p: continue
                  with open(p, errors="ignore") as fh:
                      for i, line in enumerate(fh, 1):
                          if rx.search(line):
                              hits.append(f"{p}:{i}: {line.strip()}")
          if hits:
              print("Forbidden PII/internal strings found:\n" + "\n".join(hits))
              sys.exit(1)
          print("Zero-PII audit passed across all repository files.")
          '

      - name: Python Relay Server Compilation & Self-Test
        run: |
          python3 -m py_compile server/bluepill_server.py
          python3 server/bluepill_server.py --selftest

      - name: Shell Scripts & Homebrew Formula Syntax Verification
        run: |
          bash -n bin/build bin/test
          ruby -c Formula/bluepill.rb

  build-and-test:
    name: Arch Linux Build, Unit Tests & Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch Linux Dependencies
        run: |
          pacman -Syu --noconfirm base-devel git qt6-base qt6-declarative qt6-svg qt6-wayland libnotify libheif imagemagick ttf-dejavu python

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Zero-PII & Secret Sanitization Audit
        run: |
          python3 -c '
          import os, re, sys
          forbidden = [
              r"bluebubbles\.ilb", r"bluebubbles\.home", r"home\.nertwork",
              r"172\.28\.", r"jfarr", r"Sponsee", r"Amberwood"
          ]
          rx = re.compile("|".join(forbidden), re.IGNORECASE)
          hits = []
          for dp, dn, fn in os.walk("."):
              for skip in [".git", "build", "obj", "moc", "rcc"]:
                  if skip in dn: dn.remove(skip)
              for f in fn:
                  if f.endswith((".png", ".wav", ".svg")): continue
                  p = os.path.join(dp, f)
                  if "workflows/" in p: continue
                  with open(p, errors="ignore") as fh:
                      for i, line in enumerate(fh, 1):
                          if rx.search(line):
                              hits.append(f"{p}:{i}: {line.strip()}")
          if hits:
              print("Forbidden PII/internal strings found:\n" + "\n".join(hits))
              sys.exit(1)
          print("Zero-PII audit passed across all repository files.")
          '

      - name: Compile imsg (C++20 / Qt6)
        run: ./bin/build

      - name: Run Full Test Suite (Offscreen QPA)
        run: |
          QT_QPA_PLATFORM=offscreen ./bin/test
          BLUEBUBBLES_URL=http://127.0.0.1:9 BLUEBUBBLES_PASSWORD=dummy QT_QPA_PLATFORM=offscreen ./tests/imsg_tests testIcloudCalendarEventsLifecycle
          python3 server/bluepill_server.py --selftest

      - name: Verify Demo Mode Offscreen Screenshot Rendering
        run: |
          QT_QPA_PLATFORM=offscreen ./build/imsg --demo-screenshot /tmp/ci-demo.png
          test -s /tmp/ci-demo.png

      - name: Build Arch Linux Package (makepkg)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd pkgbuild && makepkg -fs --noconfirm"
          ls -lh pkgbuild/*.pkg.tar*
