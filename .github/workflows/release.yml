name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-arch-pkg:
    name: Build & Attach Arch Linux Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch Linux Dependencies
        run: |
          pacman -Syu --noconfirm base-devel git qt6-base qt6-declarative qt6-svg qt6-wayland libnotify libheif imagemagick

      - name: Checkout Tag
        uses: actions/checkout@v4

      - name: Build & Run Unit Tests
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd pkgbuild && makepkg -fs --noconfirm"
          ls -lh pkgbuild/*.pkg.tar.zst

      - name: Upload Arch Package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pkgbuild/*.pkg.tar.zst
          generate_release_notes: true
