name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Packages & Publish Release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch Linux Dependencies
        run: |
          pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-svg qt6-wayland libnotify libheif imagemagick ttf-dejavu python tar gzip curl jq openssh ruby

      - name: Checkout Tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: vars
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(grep -m1 "project(bluepill VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9.]+).*/\1/')
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT
          echo "Building BluePill version: ${VER}"

      - name: Build & Run Unit Tests (makepkg)
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "cd pkgbuild && makepkg -fs --noconfirm"
          ls -lh pkgbuild/*.pkg.tar.zst

      - name: Build Homebrew Universal Bottles
        run: |
          VER="${{ steps.vars.outputs.version }}"
          BOTTLE_DIR="/tmp/bottle-build/bluepill/${VER}"
          mkdir -p "${BOTTLE_DIR}/bin"

          install -m 755 server/bluepill_server.py "${BOTTLE_DIR}/bin/bluepill-server"
          ln -s bluepill-server "${BOTTLE_DIR}/bin/imsgd"
          [ -f LICENSE ] && cp LICENSE "${BOTTLE_DIR}/"
          [ -f README.md ] && cp README.md "${BOTTLE_DIR}/"

          cat <<EOF > "${BOTTLE_DIR}/INSTALL_RECEIPT.json"
          {
            "homebrew_version": "4.2.0",
            "used_options": [],
            "unused_options": [],
            "built_as_bottle": true,
            "poured_from_bottle": false,
            "installed_as_dependency": false,
            "installed_on_request": true,
            "changed_files": null,
            "time": $(date +%s),
            "source_modified_time": $(date +%s),
            "source": {
              "spec": "stable",
              "versions": {
                "stable": "${VER}",
                "version_scheme": 0
              }
            }
          }
          EOF

          cd /tmp/bottle-build
          tar -czf "${GITHUB_WORKSPACE}/bluepill-${VER}.all.bottle.tar.gz" bluepill/
          cp "${GITHUB_WORKSPACE}/bluepill-${VER}.all.bottle.tar.gz" "${GITHUB_WORKSPACE}/bluepill--${VER}.all.bottle.tar.gz"
          cd "${GITHUB_WORKSPACE}"

      - name: Generate SHA256 Checksums
        run: |
          mkdir -p dist
          cp pkgbuild/*.pkg.tar.zst dist/
          cp bluepill-*.all.bottle.tar.gz dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true

      - name: Optional Sync to Homebrew Tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::notice ::HOMEBREW_TAP_TOKEN not configured. Skipping automated Homebrew Tap commit."
            exit 0
          fi
          VER="${{ steps.vars.outputs.version }}"
          SRC_URL="https://github.com/nertwork/bluepill/archive/refs/tags/v${VER}.tar.gz"
          SRC_TMP="/tmp/bluepill-v${VER}.tar.gz"
          curl -fsSL "${SRC_URL}" -o "${SRC_TMP}"
          SRC_SHA=$(sha256sum "${SRC_TMP}" | awk '{print $1}')
          rm -f "${SRC_TMP}"
          BOTTLE_SHA=$(grep "bluepill-${VER}.all.bottle.tar.gz" dist/SHA256SUMS.txt | awk '{print $1}')
          if [ -z "${SRC_SHA}" ] || [ -z "${BOTTLE_SHA}" ]; then
            echo "::error ::Missing release checksum(s): src=${SRC_SHA} bottle=${BOTTLE_SHA}"
            exit 1
          fi
          echo "Computed release checksums for v${VER}: src=${SRC_SHA} bottle=${BOTTLE_SHA}"
          git clone https://x-access-token:${TAP_TOKEN}@github.com/nertwork/homebrew-tap.git /tmp/gh-homebrew-tap
          cp Formula/bluepill.rb /tmp/gh-homebrew-tap/Formula/bluepill.rb
          VER="${VER}" SRC_URL="${SRC_URL}" SRC_SHA="${SRC_SHA}" BOTTLE_SHA="${BOTTLE_SHA}" python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ["VER"]
          src_url = os.environ["SRC_URL"]
          src_sha = os.environ["SRC_SHA"]
          bottle_sha = os.environ["BOTTLE_SHA"]
          p = pathlib.Path("/tmp/gh-homebrew-tap/Formula/bluepill.rb")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r'url "https://github\.com/nertwork/bluepill/archive/refs/tags/v[^"]+\.tar\.gz"', f'url "{src_url}"', txt, count=1)
          txt = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{src_sha}"', txt, count=1)
          txt = re.sub(r'version "[^"]+"', f'version "{ver}"', txt, count=1)
          txt = re.sub(r'root_url "https://github\.com/nertwork/bluepill/releases/download/v[^"]+"', f'root_url "https://github.com/nertwork/bluepill/releases/download/v{ver}"', txt, count=1)
          txt = re.sub(r'sha256 cellar: :any_skip_relocation, all: "[0-9a-f]{64}"', f'sha256 cellar: :any_skip_relocation, all: "{bottle_sha}"', txt, count=1)
          txt = re.sub(r'assert_match "bluepill-server [^"]+"', f'assert_match "bluepill-server {ver}"', txt, count=1)
          p.write_text(txt, encoding="utf-8")
          PY
          ruby -c /tmp/gh-homebrew-tap/Formula/bluepill.rb
          cd /tmp/gh-homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bluepill.rb
          if ! git diff-index --quiet HEAD; then
            git commit -m "feat(bluepill): update formula to v${VER}"
            git push origin main
          fi

      - name: Optional Sync to AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "${AUR_KEY}" ]; then
            echo "::notice ::AUR_SSH_PRIVATE_KEY not configured. Skipping automated AUR commit."
            exit 0
          fi
          echo "Automated AUR push enabled via SSH key."
          VER="${{ steps.vars.outputs.version }}"
          SRC_URL="https://github.com/nertwork/bluepill/archive/refs/tags/v${VER}.tar.gz"
          SRC_TMP="/tmp/bluepill-aur-v${VER}.tar.gz"
          curl -fsSL "${SRC_URL}" -o "${SRC_TMP}"
          SRC_SHA=$(sha256sum "${SRC_TMP}" | awk '{print $1}')
          rm -f "${SRC_TMP}"
          if [ -z "${SRC_SHA}" ]; then
            echo "::error ::Failed to compute v${VER} archive checksum for AUR PKGBUILD"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${AUR_KEY}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git clone ssh://aur@aur.archlinux.org/bluepill.git /tmp/aur-bluepill
          cp pkgbuild/PKGBUILD.aur /tmp/aur-bluepill/PKGBUILD
          VER="${VER}" SRC_SHA="${SRC_SHA}" python3 - <<'PY'
          import os, pathlib, re
          ver = os.environ["VER"]
          sha = os.environ["SRC_SHA"]
          p = pathlib.Path("/tmp/aur-bluepill/PKGBUILD")
          txt = p.read_text(encoding="utf-8")
          txt = re.sub(r'^pkgver=.*$', f'pkgver={ver}', txt, count=1, flags=re.M)
          txt = re.sub(r'^pkgrel=.*$', 'pkgrel=1', txt, count=1, flags=re.M)
          txt = re.sub(r"^sha256sums=\('[^']+'\)", f"sha256sums=('{sha}')", txt, count=1, flags=re.M)
          p.write_text(txt, encoding="utf-8")
          PY
          chown -R builder:builder /tmp/aur-bluepill
          su builder -c "cd /tmp/aur-bluepill && makepkg --printsrcinfo > .SRCINFO"
          chown -R root:root /tmp/aur-bluepill
          cd /tmp/aur-bluepill
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(release): bump to v${VER}"
            GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key" git push origin master
          fi
