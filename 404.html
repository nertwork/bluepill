<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — BluePill Documentation</title>
    <script>
        // Automatic redirection for .md requests to rich .html pages
        var path = window.location.pathname;
        if (path.endsWith('.md')) {
            var newPath = path.replace(/\.md$/, '.html');
            window.location.replace(newPath);
        } else if (!path.endsWith('.html') && !path.endsWith('/')) {
            // Extensionless URL fallback
            var possibleHtml = path + '.html';
            fetch(possibleHtml, { method: 'HEAD' }).then(function(res) {
                if (res.ok) {
                    window.location.replace(possibleHtml);
                }
            }).catch(function() {});
        }
    </script>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121927;
            --accent-cyan: #00e5ff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #23324d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 12px;
            max-width: 500px;
        }
        h1 { font-size: 3rem; color: var(--accent-cyan); margin-bottom: 10px; }
        p { color: var(--text-muted); margin-bottom: 25px; }
        a {
            background: var(--accent-cyan);
            color: #050811;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <h2>Document Not Found</h2>
        <p>The documentation page you requested does not exist or has been moved.</p>
        <a href="index.html">← Back to BluePill Home</a>
    </div>
</body>
</html>
